{% extends 'base.html' %}

{% block content %}
<style>
  /* ===== Enhanced 3D Bike Form Styles ===== */

  .form-page-container {
    perspective: 1200px;
    padding: 40px 0;
  }

  .page-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #fff;
    text-align: center;
    margin-bottom: 40px;
    transform: translateZ(30px);
    position: relative;
  }

  .page-title::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 4px;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    border-radius: 2px;
  }

  /* 3D Card Styling */
  .form-card-3d {
    position: relative;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 35px;
    transform-style: preserve-3d;
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
    height: 100%;
  }

  .form-card-3d::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(56, 239, 125, 0.1), rgba(17, 153, 142, 0.1));
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 0;
  }

  .form-card-3d:hover {
    transform: translateY(-10px) rotateX(3deg) translateZ(20px);
    box-shadow: 0 35px 70px rgba(56, 239, 125, 0.3);
  }

  .form-card-3d:hover::before {
    opacity: 1;
  }

  .form-card-3d>* {
    position: relative;
    z-index: 1;
  }

  .card-title-3d {
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 25px;
    transform: translateZ(15px);
    position: relative;
  }

  .card-title-3d::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 0;
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #38ef7d, #11998e);
    border-radius: 2px;
  }

  /* 3D Form Inputs */
  .form-group-3d {
    position: relative;
    margin-bottom: 20px;
    transform-style: preserve-3d;
  }

  .form-group-3d label {
    display: block;
    margin-bottom: 8px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
    font-size: 0.95rem;
    transform: translateZ(15px);
    transition: all 0.3s ease;
  }

  .input-wrapper-3d {
    position: relative;
    transform-style: preserve-3d;
  }

  .input-wrapper-3d::before {
    content: '';
    position: absolute;
    inset: -3px;
    background: linear-gradient(135deg, #38ef7d, #11998e, #667eea);
    border-radius: 15px;
    z-index: -1;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .input-wrapper-3d:focus-within::before {
    opacity: 1;
  }

  .form-control-3d {
    width: 100%;
    padding: 14px 16px;
    font-size: 1rem;
    color: #fff;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    outline: none;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    transform: translateZ(10px);
    box-shadow:
      inset 0 2px 10px rgba(0, 0, 0, 0.2),
      0 5px 15px rgba(0, 0, 0, 0.1);
  }

  .form-control-3d::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }

  .form-control-3d:focus {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.08));
    border-color: #38ef7d;
    box-shadow:
      0 0 30px rgba(56, 239, 125, 0.4),
      inset 0 2px 10px rgba(0, 0, 0, 0.2),
      0 10px 30px rgba(0, 0, 0, 0.2);
    transform: translateZ(20px);
  }

  /* 3D Submit Button */
  .btn-3d {
    position: relative;
    width: 100%;
    padding: 16px 30px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow:
      0 10px 30px rgba(56, 239, 125, 0.4),
      0 5px 15px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    margin-top: 15px;
    overflow: hidden;
  }

  .btn-3d::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
  }

  .btn-3d:hover {
    transform: translateY(-5px) translateZ(10px) scale(1.02);
    box-shadow:
      0 20px 40px rgba(56, 239, 125, 0.5),
      0 10px 25px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .btn-3d:hover::before {
    left: 100%;
  }

  /* Vehicle List Items */
  .vehicle-list-3d {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .vehicle-item-3d {
    position: relative;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
    transform-style: preserve-3d;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .vehicle-item-3d::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #38ef7d, #11998e);
    border-radius: 15px 0 0 15px;
    transform: translateZ(5px);
  }

  .vehicle-item-3d:hover {
    transform: translateX(10px) translateZ(15px);
    box-shadow: 0 15px 35px rgba(56, 239, 125, 0.25);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
  }

  .vehicle-item-3d h5 {
    color: #fff;
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 8px;
    transform: translateZ(10px);
  }

  .vehicle-item-3d p {
    color: rgba(255, 255, 255, 0.7);
    margin: 5px 0;
    font-size: 0.9rem;
    transform: translateZ(5px);
  }

  .vehicle-item-3d strong {
    color: #38ef7d;
  }

  /* Empty State */
  .empty-alert-3d {
    background: linear-gradient(135deg, rgba(56, 239, 125, 0.2), rgba(17, 153, 142, 0.2));
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    color: rgba(255, 255, 255, 0.8);
    transform: translateZ(15px);
    border: 1px solid rgba(56, 239, 125, 0.3);
  }

  /* Form fix - ensure inputs are clickable */
  .form-card-3d form {
    position: relative;
    z-index: 10;
  }

  .form-card-3d form input,
  .form-card-3d form textarea,
  .form-card-3d form select {
    position: relative;
    z-index: 10;
    pointer-events: auto;
  }

  .form-card-3d form input:focus,
  .form-card-3d form textarea:focus,
  .form-card-3d form select:focus {
    position: relative;
    z-index: 11;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .page-title {
      font-size: 2rem;
    }

    .form-card-3d {
      padding: 25px;
      margin-bottom: 20px;
    }

    .card-title-3d {
      font-size: 1.5rem;
    }
  }
</style>

<div class="container mt-5 form-page-container">
  <h1 class="page-title">Add a Bike 🏍️</h1>

  <div class="row">
    <!-- Add Bike Form Section -->
    <div class="col-md-6 mb-4">
      <div class="form-card-3d">
        <h2 class="card-title-3d">Add a Bike</h2>
        <form method="post">
          {% csrf_token %}

          <div class="form-group-3d">
            <div class="input-wrapper-3d">
              {{ form.as_p }}
            </div>
          </div>

          <button type="submit" class="btn-3d">🏍️ Add Bike</button>
        </form>
      </div>
    </div>

    <!-- Existing Bikes Section -->
    <div class="col-md-6 mb-4">
      <div class="form-card-3d">
        <h2 class="card-title-3d">Existing Bikes</h2>
        <div class="list-group">
          {% for bike in bikes %}
          <div class="vehicle-item-3d">
            <h5>{{ bike.bike_name }}</h5>
            <p><strong>Number:</strong> {{ bike.bike_number }}</p>
            <p><strong>Owner:</strong> {{ bike.owner.name }}</p>
          </div>
          {% empty %}
          <div class="empty-alert-3d">
            🏍️ No bikes available
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
