<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vehicle Rental System</title>
  {% load static %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* ===== 3D Animated Background ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      perspective: 1500px;
    }

    /* Animated floating shapes */
    .bg-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      animation: float 20s infinite ease-in-out;
    }

    .shape-1 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4));
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .shape-2 {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.3), rgba(255, 142, 83, 0.3));
      top: 50%;
      right: -50px;
      animation-delay: -5s;
    }

    .shape-3 {
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, rgba(0, 255, 200, 0.3), rgba(0, 200, 255, 0.3));
      bottom: 10%;
      left: 10%;
      animation-delay: -10s;
    }

    .shape-4 {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, rgba(255, 179, 71, 0.3), rgba(255, 123, 71, 0.3));
      bottom: -80px;
      right: 20%;
      animation-delay: -15s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      25% {
        transform: translate(50px, 50px) rotate(90deg) scale(1.1);
      }
      50% {
        transform: translate(0, 100px) rotate(180deg) scale(1);
      }
      75% {
        transform: translate(-50px, 50px) rotate(270deg) scale(0.9);
      }
    }

    /* ===== 3D Login Card ===== */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      perspective: 2000px;
    }

    .login-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 45px 35px;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 0 30px rgba(255, 255, 255, 0.05);
      transform-style: preserve-3d;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      animation: cardFloat 6s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%, 100% {
        transform: translateY(0) rotateX(0) rotateY(0);
      }
      50% {
        transform: translateY(-10px) rotateX(2deg) rotateY(-2deg);
      }
    }

    .login-card:hover {
      transform: translateY(-15px) rotateX(5deg) rotateY(-5deg);
      box-shadow: 
        0 40px 70px rgba(102, 126, 234, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        inset 0 0 50px rgba(255, 255, 255, 0.1);
    }

    /* ===== 3D Title ===== */
    .login-title {
      text-align: center;
      margin-bottom: 35px;
      transform: translateZ(30px);
    }

    .login-title h2 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
      margin-bottom: 8px;
    }

    .login-title p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }

    /* ===== 3D Form Inputs ===== */
    .form-group-3d {
      position: relative;
      margin-bottom: 25px;
      transform-style: preserve-3d;
    }

    .form-group-3d label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      font-size: 0.9rem;
      transform: translateZ(15px);
      transition: all 0.3s ease;
    }

    .input-wrapper {
      position: relative;
      transform-style: preserve-3d;
    }

    .input-wrapper::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      border-radius: 15px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .input-wrapper:focus-within::before {
      opacity: 1;
    }

    .form-control-3d {
      width: 100%;
      padding: 15px 18px;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      outline: none;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      transform: translateZ(10px);
      box-shadow: 
        inset 0 2px 10px rgba(0, 0, 0, 0.2),
        0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .form-control-3d::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-control-3d:focus {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.08));
      border-color: #667eea;
      box-shadow: 
        0 0 30px rgba(102, 126, 234, 0.4),
        inset 0 2px 10px rgba(0, 0, 0, 0.2),
        0 10px 30px rgba(0, 0, 0, 0.2);
      transform: translateZ(20px);
    }

    /* ===== 3D Submit Button ===== */
    .btn-3d {
      position: relative;
      width: 100%;
      padding: 16px 30px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 
        0 10px 30px rgba(102, 126, 234, 0.4),
        0 5px 15px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      margin-top: 10px;
      overflow: hidden;
    }

    .btn-3d::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .btn-3d:hover {
      transform: translateY(-5px) translateZ(10px);
      box-shadow: 
        0 20px 40px rgba(102, 126, 234, 0.5),
        0 10px 25px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    .btn-3d:hover::before {
      left: 100%;
    }

    .btn-3d:active {
      transform: translateY(2px) translateZ(5px);
      box-shadow: 
        0 5px 15px rgba(102, 126, 234, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* ===== 3D Decorative Elements ===== */
    .card-glow {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 50%);
      animation: rotateGlow 15s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ===== Link Styling ===== */
    .login-links {
      text-align: center;
      margin-top: 25px;
      transform: translateZ(20px);
    }

    .login-links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .login-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #667eea, #f093fb);
      transition: width 0.3s ease;
    }

    .login-links a:hover {
      color: #f093fb;
      text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
    }

    .login-links a:hover::after {
      width: 100%;
    }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .login-card {
        padding: 35px 25px;
      }
      
      .login-title h2 {
        font-size: 1.8rem;
      }
      
      .form-control-3d {
        padding: 12px 15px;
        font-size: 0.95rem;
      }
      
      .btn-3d {
        padding: 14px 25px;
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- Animated Background -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-card">
      <div class="card-glow"></div>
      
      <!-- Title -->
      <div class="login-title">
        <h2>Welcome Back! 🚗</h2>
        <p>Login to rent your perfect vehicle</p>
      </div>

      <!-- Login Form -->
      <form method="POST">
        {% csrf_token %}
        
        <!-- Username Field -->
        <div class="form-group-3d">
          <label for="id_username">Username</label>
          <div class="input-wrapper">
            <input type="text" name="username" id="id_username" class="form-control-3d" placeholder="Enter your username" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group-3d">
          <label for="id_password">Password</label>
          <div class="input-wrapper">
            <input type="password" name="password" id="id_password" class="form-control-3d" placeholder="Enter your password" required>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-3d">
          🚀 Login Now
        </button>

        <!-- Links -->
        <div class="login-links">
          <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
