{% extends 'base.html' %}
{% block content %}
<style>
  /* ===== 3D Add Profile Styles ===== */
  
  .profile-container {
    perspective: 1200px;
    padding: 40px 0;
  }
  
  .page-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #fff;
    text-align: center;
    margin-bottom: 40px;
    transform: translateZ(30px);
    position: relative;
  }
  
  .page-title::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 4px;
    background: linear-gradient(90deg, #667eea, #f093fb);
    border-radius: 2px;
  }
  
  /* 3D Form Card */
  .profile-card {
    position: relative;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 40px;
    transform-style: preserve-3d;
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  
  .profile-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 0;
  }
  
  .profile-card:hover {
    transform: translateY(-10px) rotateX(3deg) translateZ(20px);
    box-shadow: 0 35px 70px rgba(102, 126, 234, 0.3);
  }
  
  .profile-card:hover::before {
    opacity: 1;
  }
  
  .profile-card > * {
    position: relative;
    z-index: 1;
  }
  
  /* 3D Form Inputs */
  .form-group-3d {
    position: relative;
    margin-bottom: 25px;
    transform-style: preserve-3d;
  }
  
  .form-group-3d label {
    display: block;
    margin-bottom: 10px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
    font-size: 1rem;
    transform: translateZ(15px);
    transition: all 0.3s ease;
  }
  
  .input-wrapper-3d {
    position: relative;
    transform-style: preserve-3d;
  }
  
  .input-wrapper-3d::before {
    content: '';
    position: absolute;
    inset: -3px;
    background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
    border-radius: 15px;
    z-index: -1;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  
  .input-wrapper-3d:focus-within::before {
    opacity: 1;
  }
  
  .form-control-3d {
    width: 100%;
    padding: 15px 18px;
    font-size: 1rem;
    color: #fff;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    outline: none;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    transform: translateZ(10px);
    box-shadow: 
      inset 0 2px 10px rgba(0, 0, 0, 0.2),
      0 5px 15px rgba(0, 0, 0, 0.1);
  }
  
  .form-control-3d::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }
  
  .form-control-3d:focus {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.08));
    border-color: #667eea;
    box-shadow: 
      0 0 30px rgba(102, 126, 234, 0.4),
      inset 0 2px 10px rgba(0, 0, 0, 0.2),
      0 10px 30px rgba(0, 0, 0, 0.2);
    transform: translateZ(20px);
  }
  
  /* 3D Submit Button */
  .btn-3d {
    position: relative;
    width: 100%;
    padding: 16px 30px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 
      0 10px 30px rgba(102, 126, 234, 0.4),
      0 5px 15px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    margin-top: 15px;
    overflow: hidden;
  }
  
  .btn-3d::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
  }
  
  .btn-3d:hover {
    transform: translateY(-5px) translateZ(10px) scale(1.02);
    box-shadow: 
      0 20px 40px rgba(102, 126, 234, 0.5),
      0 10px 25px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  
  .btn-3d:hover::before {
    left: 100%;
  }
  
  .btn-3d:active {
    transform: translateY(2px) translateZ(5px);
    box-shadow: 
      0 5px 15px rgba(102, 126, 234, 0.4),
      0 2px 8px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }
  
  /* Form paragraph styling */
  .profile-card form p {
    margin-bottom: 20px;
  }
  
  .profile-card form p:has(input) {
    transform: translateZ(10px);
  }
  
  /* Responsive */
  @media (max-width: 768px) {
    .page-title {
      font-size: 2rem;
    }
    
    .profile-card {
      padding: 25px;
    }
  }
</style>

<div class="container mt-5 profile-container">
  <h1 class="page-title">Add Profile Details 👤</h1>

  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="profile-card">
        <form method="post">
          {% csrf_token %}
          
          <div class="form-group-3d">
            <div class="input-wrapper-3d">
              {{ form.as_p }}
            </div>
          </div>
          
          <button type="submit" class="btn-3d">
            💾 Save Profile
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
